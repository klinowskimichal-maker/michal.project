    #shareReady{opacity:0;visibility:hidden}

  <meta property="og:url" content="https://klinowskimichal-maker.github.io/michal.project/udostepnij.html">
  <meta property="og:image" content="https://klinowskimichal-maker.github.io/michal.project/assets/branding/pskl-tabliczka.webp">
  <meta property="og:image:width" content="1659">
  <meta property="og:image:height" content="948">
  <meta property="og:image:alt" content="Metalowa tabliczka PSKL">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://klinowskimichal-maker.github.io/michal.project/assets/branding/pskl-tabliczka.webp">
  <link rel="manifest" href="manifest.webmanifest?v=scope-66">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/branding/pskl-tabliczka-icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/branding/pskl-tabliczka-apple-180.png">
  <link rel="stylesheet" href="assets/css/share.css?v=metal-9">
  <script src="assets/js/i18n-data.js?v=2" defer></script>
  <script src="assets/js/i18n.js?v=7" defer></script>
  <script src="assets/js/share.js?v=metal-14" defer></script>
  <script src="assets/js/security.js?v=1" defer></script>
</head>
<body>
  <main id="shareReady">
    <header class="share-topbar"><a href="./index.html?v=61#association" aria-label="Wróć do katalogu PSKL">← PSKL</a><div class="lang-switch" aria-label="Language"><button type="button" data-lang="pl">PL</button><button type="button" data-lang="en">EN</button></div></header>
    <section class="masthead" aria-label="Tabliczka i opcje PSKL">
      <a class="logo-link" href="./index.html?v=61#association" aria-label="Otwórz katalog PSKL">
        <span id="logoMount" aria-hidden="true"></span>
      </a>
      <div class="actions">
        <button id="shareLink" class="primary" type="button">Udostępnij</button>
        <button id="installApp" type="button">Zainstaluj</button>
        <button id="copyLink" type="button">Kopiuj link</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <footer><span>Chronimy dziedzictwo. Budujemy tradycję. Inspirujemy przyszłość.</span> <span>© 2026 PSKL MK.</span></footer>
  </main>
  <script>
    (function(){
      const mount=document.getElementById('logoMount');
      const img=new Image();
      img.width=1659;
      img.height=948;
      img.alt='Metalowa tabliczka PSKL';
      function reveal(){
        if(mount && !mount.firstChild) mount.appendChild(img);
        document.documentElement.classList.add('pskl-ready');
      }
      img.addEventListener('load',function(){
        if(img.decode){img.decode().catch(function(){}).finally(reveal);}
        else reveal();
      },{once:true});
      img.addEventListener('error',reveal,{once:true});
      img.src='assets/branding/pskl-tabliczka.webp?v=66';
      if(img.complete) reveal();
      setTimeout(reveal,2500);
    })();
  </script>
</body>
</html>
