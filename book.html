<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061b2b"><title>Księga Założycielska — Wydanie I</title><style>html,body{margin:0;min-height:100%;background:#061b2b;color:#fff;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}.loading strong{color:#d4a06e;font:700 20px Georgia,serif}.loading small{display:block;margin-top:10px;color:#bdc7cd}.back{display:inline-block;margin-top:18px;color:#d4a06e;text-decoration:none}</style></head><body><div class="loading" id="loading"><div><strong>⚓ Księga Założycielska</strong><small>Otwieranie dokumentu…</small></div></div><script src="assets/js/bookv12-1.js?v=13"></script><script src="assets/js/bookv12-2.js?v=13"></script><script src="assets/js/bookv12-3.js?v=13"></script><script src="assets/js/bookv12-4.js?v=13"></script><script src="assets/js/bookv12-5.js?v=13"></script><script>(async()=>{try{const payload=window.PSKL_BOOK_DATA||'';if(!payload)throw new Error('Brak danych Księgi');const b=atob(payload);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);if(!('DecompressionStream' in window))throw new Error('Przeglądarka nie obsługuje dekompresji');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<div><strong>Nie udało się otworzyć Księgi.</strong><small>Odśwież stronę albo wróć do strony głównej.</small><br><a class="back" href="index.html#book">← Powrót do PSKŁ</a></div>'}})();</script></body></html>
