<script>
(()=>{
 const sheets=[...document.querySelectorAll('.sheet')];
 const input=document.getElementById('pageInput');
 let current=1, pageWidth=Math.min(892,innerWidth-24);
 const go=n=>{n=Math.max(1,Math.min(34,Math.round(Number(n)||1)));current=n;input.value=n;document.getElementById('page-'+n)?.scrollIntoView({behavior:'smooth',block:'start'});};
 document.getElementById('prev').onclick=()=>go(current-1);
 document.getElementById('next').onclick=()=>go(current+1);
 input.addEventListener('change',()=>go(input.value));
 input.addEventListener('keydown',e=>{if(e.key==='Enter')go(input.value)});
 document.getElementById('top').onclick=()=>go(1);
 document.getElementById('zoomIn').onclick=()=>{pageWidth=Math.min(1400,pageWidth+120);document.documentElement.style.setProperty('--page-w',pageWidth+'px')};
 document.getElementById('zoomOut').onclick=()=>{pageWidth=Math.max(240,pageWidth-120);document.documentElement.style.setProperty('--page-w',pageWidth+'px')};
 const intersections=new Map();
 const observer=new IntersectionObserver(entries=>{
   entries.forEach(e=>{if(e.isIntersecting)intersections.set(e.target,e);else intersections.delete(e.target)});
   const visible=[...intersections.values()].sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
   if(!visible)return;
   sheets.forEach(s=>s.classList.remove('current'));
   visible.target.classList.add('current');
   current=Number(visible.target.dataset.page);input.value=current;
 },{threshold:[.25,.45,.65,.8]});
 sheets.forEach(s=>observer.observe(s));
 document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,button,a'))return;if(['ArrowRight','ArrowLeft','PageDown','PageUp','Home','End'].includes(e.key))e.preventDefault();if(e.key==='ArrowRight'||e.key==='PageDown')go(current+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(current-1);if(e.key==='Home')go(1);if(e.key==='End')go(34)});
})();
</script>
