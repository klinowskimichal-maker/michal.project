<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061b2b">
<title>Księga Założycielska - Wydanie I | PSKL</title>
<meta name="description" content="Księga Założycielska PSKL - Wydanie I. Oryginalny PDF PL i angielskie wydanie PDF.">
<link rel="manifest" href="manifest.webmanifest?v=tabliczka-5">
<link rel="icon" type="image/png" sizes="192x192" href="assets/branding/pskl-tabliczka-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/branding/pskl-tabliczka-apple-180.png">
<meta name="apple-mobile-web-app-title" content="PSKL">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--navy:#061b2b;--navy2:#0b3147;--copper:#b8793f;--brass:#d4a06e;--paper:#f5f1e8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#061b2b}
body{color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
.toolbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;min-height:58px;padding:8px max(8px,env(safe-area-inset-left));border-bottom:1px solid rgba(212,160,110,.55);background:rgba(4,23,35,.96);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.back,.ctrl{border:1px solid rgba(212,160,110,.72);background:#0b3147;color:#f3d3aa;border-radius:9px;padding:9px 11px;text-decoration:none;font-weight:700;cursor:pointer;white-space:nowrap}
.back:hover,.ctrl:hover{background:#124662}
.title{min-width:0;flex:1}
.title strong{display:block;color:#f3d3aa;font:700 15px/1.2 Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;margin-top:3px;color:#9eb0ba;font-size:10px;letter-spacing:.09em}
.lang{display:flex;gap:4px}.lang button{border:1px solid rgba(212,160,110,.72);background:#071f30;color:#f3d3aa;border-radius:7px;padding:7px 8px;font-weight:700;cursor:pointer}.lang button.active{background:#d4a06e;color:#061b2b}
.pagebox{display:flex;align-items:center;gap:5px;color:#d4a06e;font-weight:700;font-size:12px;white-space:nowrap}
.pagebox input{width:48px;border:1px solid rgba(212,160,110,.55);border-radius:7px;background:#041a28;color:#fff;padding:7px 5px;text-align:center;font-weight:700}
.stage{display:flex;justify-content:center;align-items:flex-start;min-height:calc(100vh - 90px);padding:18px 10px 70px;overflow:auto;background:radial-gradient(circle at 50% -10%,#123f58 0,#061b2b 44%,#03131f 100%)}
.page-shell{position:relative;flex:none;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(212,160,110,.5);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#pdfCanvas{display:block;background:#fff;pointer-events:none;image-rendering:auto}
.watermark{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.watermark span{position:absolute;color:rgba(6,27,43,.105);font:800 clamp(19px,3vw,42px)/1 Arial,Helvetica,sans-serif;letter-spacing:.13em;transform:rotate(-31deg);white-space:nowrap}
.watermark span:nth-child(1){left:12%;top:18%}.watermark span:nth-child(2){right:10%;top:38%}.watermark span:nth-child(3){left:16%;top:62%}.watermark span:nth-child(4){right:13%;top:80%}
.loading{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#061b2b;font-weight:700}
.loading[hidden]{display:none}
@media(max-width:720px){
 .toolbar{gap:5px;min-height:54px;padding:6px 5px}
 .back{font-size:0;padding:9px 10px}.back::after{content:'←';font-size:17px}
 .ctrl{padding:8px 9px}
 .title strong{font-size:12px}.title small{display:none}
 .pagebox{font-size:10px}.pagebox input{width:39px;padding:6px 2px}
 .stage{padding:10px 4px 60px}
}
@media print{body{display:none!important}}
</style>
</head>
<body>
<nav class="toolbar" aria-label="Nawigacja Księgi">
  <a class="back" href="index.html#book">← PSKL</a>
  <div class="title"><strong id="bookTitle">Księga Założycielska - Wydanie I</strong><small id="bookMeta">PSKL · SZCZECIN · 2026 · PDF</small></div>
  <div class="lang" aria-label="Language"><button type="button" data-lang="pl">PL</button><button type="button" data-lang="en">EN</button></div>
  <button class="ctrl" id="prev" type="button" aria-label="Poprzednia strona">‹</button>
  <div class="pagebox"><input id="pageInput" type="number" min="1" value="1" aria-label="Numer strony"><span id="pageTotal">/ 34</span></div>
  <button class="ctrl" id="next" type="button" aria-label="Następna strona">›</button>
  <button class="ctrl" id="zoomOut" type="button" aria-label="Pomniejsz">−</button>
  <button class="ctrl" id="zoomIn" type="button" aria-label="Powiększ">+</button>
</nav>
<main class="stage" id="stage">
  <div class="page-shell" id="pageShell">
    <canvas id="pdfCanvas" aria-label="Strona Księgi"></canvas>
    <div class="watermark" aria-hidden="true"><span>PSKL MK</span><span>PSKL MK</span><span>PSKL MK</span><span>PSKL MK</span></div>
    <div class="loading" id="loading">Ładowanie PDF...</div>
  </div>
</main>
<script src="assets/js/security.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
(()=>{
 const PDFS={
   pl:'assets/book/ksiega-zalozycielska.pdf?v=52',
   enParts:35,
   enBase:'assets/book-en/pdf-data/'
 };
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
 const canvas=document.getElementById('pdfCanvas');
 const ctx=canvas.getContext('2d',{alpha:false});
 const shell=document.getElementById('pageShell');
 const stage=document.getElementById('stage');
 const input=document.getElementById('pageInput');
 const total=document.getElementById('pageTotal');
 const loading=document.getElementById('loading');
 const title=document.getElementById('bookTitle');
 const meta=document.getElementById('bookMeta');
 let lang=localStorage.getItem('pskl-language')==='en'?'en':'pl';
 let doc=null,current=1,zoom=1,renderTask=null,renderSeq=0;

 function setLanguageUI(){
   document.documentElement.lang=lang;
   document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
   if(lang==='en'){
     document.title='Founding Book - First Edition | PSKL';
     title.textContent='Founding Book - First Edition';
     meta.textContent='PSKL · SZCZECIN · 2026 · PDF';
     loading.textContent='Loading PDF...';
   }else{
     document.title='Księga Założycielska - Wydanie I | PSKL';
     title.textContent='Księga Założycielska - Wydanie I';
     meta.textContent='PSKL · SZCZECIN · 2026 · PDF';
     loading.textContent='Ładowanie PDF...';
   }
 }

 async function loadBook(nextLang=lang){
   lang=nextLang;
   localStorage.setItem('pskl-language',lang);
   setLanguageUI();
   loading.hidden=false;
   try{
     if(renderTask){try{renderTask.cancel()}catch(e){}}
     if(doc){try{await doc.destroy()}catch(e){}}
     let source;
     if(lang==='en'){
       const parts=await Promise.all(Array.from({length:PDFS.enParts},async(_,i)=>{
         const name='en'+String(i).padStart(2,'0')+'.b64';
         const response=await fetch(PDFS.enBase+name+'?v=52',{cache:'force-cache'});
         if(!response.ok)throw new Error('Missing English PDF data: '+name);
         return (await response.text()).trim();
       }));
       const b64=parts.join('').replace(/\s+/g,'');
       const raw=atob(b64);
       const bytes=new Uint8Array(raw.length);
       for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
       source={data:bytes};
     }else{
       source={url:PDFS.pl};
     }
     doc=await pdfjsLib.getDocument({...source,disableFontFace:false,useSystemFonts:true}).promise;
     current=Math.max(1,Math.min(current,doc.numPages));
     input.max=doc.numPages;
     total.textContent='/ '+doc.numPages;
     await renderPage();
   }catch(err){
     console.error(err);
     loading.hidden=false;
     loading.textContent=lang==='en'?'PDF could not be loaded.':'Nie udało się wczytać PDF.';
   }
 }

 async function renderPage(){
   if(!doc)return;
   const seq=++renderSeq;
   loading.hidden=false;
   if(renderTask){try{renderTask.cancel()}catch(e){}}
   const page=await doc.getPage(current);
   if(seq!==renderSeq)return;
   const base=page.getViewport({scale:1});
   const maxCssWidth=Math.max(260,Math.min(1200,window.innerWidth-16));
   const fit=maxCssWidth/base.width;
   const cssScale=Math.max(.45,fit*zoom);
   const dpr=Math.min(Math.max(window.devicePixelRatio||1,2),4);
   const viewport=page.getViewport({scale:cssScale*dpr});
   const cssWidth=viewport.width/dpr;
   const cssHeight=viewport.height/dpr;
   canvas.width=Math.ceil(viewport.width);
   canvas.height=Math.ceil(viewport.height);
   canvas.style.width=cssWidth+'px';
   canvas.style.height=cssHeight+'px';
   shell.style.width=cssWidth+'px';
   shell.style.height=cssHeight+'px';
   input.value=current;
   renderTask=page.render({canvasContext:ctx,viewport,background:'rgb(255,255,255)'});
   try{await renderTask.promise}catch(e){if(e&&e.name!=='RenderingCancelledException')throw e}
   if(seq===renderSeq)loading.hidden=true;
 }

 function go(n){
   if(!doc)return;
   current=Math.max(1,Math.min(doc.numPages,Math.round(Number(n)||1)));
   renderPage();
   stage.scrollTo({top:0,left:Math.max(0,(shell.offsetWidth-stage.clientWidth)/2),behavior:'smooth'});
 }

 document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>loadBook(b.dataset.lang));
 document.getElementById('prev').onclick=()=>go(current-1);
 document.getElementById('next').onclick=()=>go(current+1);
 input.onchange=()=>go(input.value);
 input.onkeydown=e=>{if(e.key==='Enter')go(input.value)};
 document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(3,zoom+.2);renderPage()};
 document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(.6,zoom-.2);renderPage()};
 window.addEventListener('resize',()=>{clearTimeout(window.__psklResize);window.__psklResize=setTimeout(renderPage,120)});

 let touchStartX=0,touchStartY=0,touchStartAt=0;
 stage.addEventListener('touchstart',e=>{
   if(e.touches.length!==1)return;
   const t=e.touches[0];
   touchStartX=t.clientX;
   touchStartY=t.clientY;
   touchStartAt=Date.now();
 },{passive:true});
 stage.addEventListener('touchend',e=>{
   if(!doc||zoom>1.05||!e.changedTouches.length)return;
   const t=e.changedTouches[0];
   const dx=t.clientX-touchStartX;
   const dy=t.clientY-touchStartY;
   const dt=Date.now()-touchStartAt;
   if(dt>900||Math.abs(dx)<55||Math.abs(dx)<=Math.abs(dy)*1.2)return;
   go(dx<0?current+1:current-1);
 },{passive:true});

 document.addEventListener('contextmenu',e=>e.preventDefault());
 document.addEventListener('copy',e=>e.preventDefault());
 document.addEventListener('cut',e=>e.preventDefault());
 document.addEventListener('dragstart',e=>e.preventDefault());
 document.addEventListener('selectstart',e=>{if(!e.target.matches('input'))e.preventDefault()});
 document.addEventListener('keydown',e=>{
   if((e.ctrlKey||e.metaKey)&&['c','x','s','p','u','a'].includes(e.key.toLowerCase())){e.preventDefault();e.stopPropagation()}
   if(e.target.matches('input,textarea,select,button,a'))return;
   if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(current+1)}
   if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}
   if(e.key==='Home'){e.preventDefault();go(1)}
   if(e.key==='End'&&doc){e.preventDefault();go(doc.numPages)}
 });
 window.addEventListener('beforeprint',e=>{e.preventDefault()});
 setLanguageUI();
 loadBook(lang);
})();
</script>
</body>
</html>
