<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061b2b"><title>Księga Założycielska — Wydanie I</title><style>html,body{margin:0;min-height:100%;background:#061b2b;color:#fff;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}.loading strong{color:#d4a06e;font:700 20px Georgia,serif}.loading small{display:block;margin-top:10px;color:#bdc7cd}</style></head><body><div class="loading" id="loading"><div><strong>⚓ Księga Założycielska</strong><small>Otwieranie wersji internetowej…</small></div></div><script src="assets/js/book-payload-1.js"></script><script src="assets/js/book-payload-2.js"></script><script src="assets/js/book-payload-3.js"></script><script>(async()=>{try{const b=atob(window.BOOK_PAYLOAD||'');const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<div><strong>Nie udało się otworzyć Księgi.</strong><small>Odśwież stronę lub wróć do strony głównej.</small><p><a style="color:#d4a06e" href="index.html#book">Powrót</a></p></div>'}})();</script></body></html>
