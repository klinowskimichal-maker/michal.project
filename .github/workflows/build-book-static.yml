name: Sprawdź statyczną Księgę

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdź lokalną Księgę
        run: |
          test "$(find assets/book -maxdepth 1 -name 'page-*.png' | wc -l)" -eq 34
          test -s book.html
          ! grep -qi 'canva.com' book.html
          grep -q 'assets/book/page-01.png' book.html
          grep -q 'assets/book/page-34.png' book.html
          echo "Księga PSKŁ: 34 lokalne strony, bez przekierowania do Canvy."
